<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#26343b">
<title>빌라드지디 안산점 | 주차팀 현장 운영 매뉴얼</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic",Arial,sans-serif;color:#27333a;background:#f6f7f8}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px}
main{max-width:430px;width:100%;padding:28px;background:white;border:1px solid #d8dde2;border-radius:8px}
h1{font-size:20px;margin:0 0 14px}p{font-size:14px;line-height:1.65;color:#52606a}
.links{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}.links a{border:1px solid #cbd2d8;color:#26343b;text-decoration:none;font-size:14px;padding:12px 16px;border-radius:4px;font-weight:700}
</style>
<script>
(function(){
  var p=new URLSearchParams(location.search);
  var v=p.get('view');
  var isMobile = /Android|iPhone|iPod|iPad|Mobile/i.test(navigator.userAgent) || (window.innerWidth <= 800);
  var target= v==='pc'?'pc.html':v==='mobile'?'mobile.html':(isMobile?'mobile.html':'pc.html');
  window.location.replace(new URL(target,location.href).href);
})();
</script>
</head>
<body><main><h1>빌라드지디 안산점</h1><p>주차팀 현장 운영 매뉴얼을 여는 중입니다. 자동으로 열리지 않으면 아래에서 기기를 선택해 주세요.</p><div class="links"><a href="mobile.html">모바일로 열기</a><a href="pc.html">PC로 열기</a></div></main></body></html>
